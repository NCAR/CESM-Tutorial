name: Post PR comment with doc-build failure log

env:
  # How many open PRs to scan when matching the triggering run's head SHA to a PR.
  # Raise this if the repo ever has more open PRs than this at once.
  MAX_OPEN_PRS_TO_SCAN: 100
  # Longest build log (in bytes) to paste into the PR comment. GitHub rejects comment bodies over
  # 65536 characters, and the rest of the comment needs some room, so keep this comfortably below.
  MAX_LOG_BYTES: 60000

on:
  workflow_run:
    workflows: ["JupyterBook"]
    types: [completed]

jobs:
  comment:
    if: >-
      github.event.workflow_run.event == 'pull_request'
      && github.event.workflow_run.conclusion == 'failure'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      actions: read
    steps:
      - name: Download logs
        uses: actions/download-artifact@v4
        with:
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # The artifact comes from a pull_request run, which a fork PR fully controls. Never take
      # the PR number from it: this job has pull-requests: write, so a forged number would let a
      # fork post on any PR. Instead look the PR up from the head SHA of the run that triggered
      # us, which GitHub sets and the fork can't forge. The log body is still attacker-controlled,
      # but it can only ever land on the PR that produced it.
      - name: Find PR for triggering run
        id: find-pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          if ! [[ "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Unexpected head SHA '${HEAD_SHA}'; not posting comment."
            exit 1
          fi

          PR_NUMBER=$(gh pr list --repo "$REPO" --state open --limit "$MAX_OPEN_PRS_TO_SCAN" --json number,headRefOid \
            --jq ".[] | select(.headRefOid == \"${HEAD_SHA}\") | .number" | head -n 1)

          if ! [[ "$PR_NUMBER" =~ ^[0-9]+$ ]]; then
            echo "::error::No open PR found with head SHA ${HEAD_SHA}; not posting comment."
            exit 1
          fi
          echo "number=${PR_NUMBER}" >> "$GITHUB_OUTPUT"

      - name: Post comment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ steps.find-pr.outputs.number }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
        run: |
          # shopt here saves the literal globbed string if the glob on the logs= line finds no
          # matches, which will later cause an error at `cat`.
          shopt -s nullglob

          # Using an array here avoids issues with `wc -w` where filenames have spaces
          logs=(*/build.log)
          if (( ${#logs[@]} == 0 )); then
            echo "::error::No build log in artifacts; nothing to post."
            exit 2
          elif (( ${#logs[@]} > 1 )); then
            echo "::error::Expected 1 build log; found ${#logs[@]}: ${logs[*]}"
            exit 3
          fi
          
          # Keep the tail: sphinx prints its warning summary at the end.
          log_bytes=$(wc -c < "${logs[0]}" | tr -d " ")
          truncated=false
          if (( log_bytes > MAX_LOG_BYTES )); then
            truncated=true
          fi

          {
            echo "### ❌ jupyter-book build failed"
            echo
            if [[ "$truncated" == true ]]; then
              echo "> ⚠️ Log was ${log_bytes} bytes; only the last ${MAX_LOG_BYTES} are shown below. See the [workflow run](${RUN_URL}) for the full log."
              echo
            fi
            echo '<details open="true">'
            echo "<summary>Build logs</summary>"
            echo
            # Four backticks so a ``` inside the log can't close the fence early.
            echo '````'
            tail -c "$MAX_LOG_BYTES" "${logs[0]}"
            # Make sure the closing fence starts on its own line even if the log lacks a trailing newline.
            echo
            echo '````'
            echo
            echo "</details>"
          } > comment-body.md

          gh pr comment "$PR_NUMBER" --repo "$REPO" --body-file comment-body.md
