name: JupyterBook
#name: Build and Publish JupyterBook to GitHub Pages
#
on:
  push:
    branches:
      - main
  workflow_dispatch:
  pull_request:

jobs:
  build:
    if: github.repository == 'NCAR/CESM-Tutorial'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: 3.9
        cache: 'pip'
    - name: Install Python dependencies
      run: |
        sudo apt-get install python3-pip
        pip install -r requirements.txt
        PATH="${PATH}:${HOME}/.local/bin"
    - name: Build book HTML
      run: |
        jupyter-book build .
    - name: Push _build/html to gh-pages
      # The below condition allows publication on pushes to main (including PR merges) as well as workflow_dispatch from main.
      if: github.ref == 'refs/heads/main'
      run: |
        sudo chown -R $(whoami):$(whoami) .
        git config --global user.email "$GITHUB_ACTOR@users.noreply.github.com"
        git config --global user.name "$GITHUB_ACTOR"
        git remote set-url origin "https://$GITHUB_ACTOR:${{ secrets.GITHUB_TOKEN }}@github.com/$GITHUB_REPOSITORY"
        ls -lrt
        ghp-import -n -p -f _build/html
