name: JupyterBook

on:
  push:
    branches:
      - main
  workflow_dispatch:
  pull_request:

jobs:
  build:
    if: github.repository == 'NCAR/CESM-Tutorial'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: 3.9
        cache: 'pip'

    - name: Install Python dependencies
      run: |
        sudo apt-get install python3-pip
        pip install -r requirements.txt
        PATH="${PATH}:${HOME}/.local/bin"

    - name: Build book HTML
      id: build-jupyter-book
      # The `-W --keep-going --nitpick` in the below command is intended to prevent the tutorial from being broken.
      # Do not remove it! If you can't figure out what the problem was, contact Sam Rabin
      # (samrabin@ucar.edu) or another software engineer for help.
      run: |
        mkdir -p build-logs
        jupyter-book build -W --keep-going --nitpick --quiet . 2>&1 | tee build-logs/build.log

    # The next step only triggers on failure of above build-jupyter-book step on PRs.
    # It uploads logs that will be used by the build-jupyter-book-failure-post-comment.yml
    # workflow. Do not put anything in build-logs/ that that workflow must trust: on a
    # fork PR, this job runs the fork's copy of this file, so the artifact's contents are
    # attacker-controlled.

    - name: Upload logs on failure
      if: failure() && steps.build-jupyter-book.outcome == 'failure' && github.event_name == 'pull_request'
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
      with:
        name: build-failed
        path: build-logs/

    - name: Push _build/html to gh-pages
      # The below condition allows publication on pushes to main (including PR merges) as well as workflow_dispatch from main.
      if: github.ref == 'refs/heads/main'
      run: |
        sudo chown -R $(whoami):$(whoami) .
        git config --global user.email "$GITHUB_ACTOR@users.noreply.github.com"
        git config --global user.name "$GITHUB_ACTOR"
        git remote set-url origin "https://$GITHUB_ACTOR:${{ secrets.GITHUB_TOKEN }}@github.com/$GITHUB_REPOSITORY"
        ls -lrt
        ghp-import -n -p -f _build/html
